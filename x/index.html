<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#050506"><title>EDON X · בקרוב</title>
<link rel="icon" href="../icon-192.png"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;900&family=JetBrains+Mono:wght@400&display=swap">
<style>
html,body{height:100%;margin:0;background:#050506;color:#F3F3EE;font:400 17px/1.6 Heebo,system-ui,sans-serif}
body{display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box;overflow:hidden}
.sw{width:120px;aspect-ratio:172/100;border-radius:999px;background:#C8FF2E;position:relative;margin:0 auto 34px;box-shadow:0 0 90px 10px rgba(200,255,46,.28);animation:pulse 2.6s ease-in-out infinite}
.sw i{position:absolute;top:7%;bottom:7%;right:4%;aspect-ratio:1;border-radius:50%;background:#0B0B10;display:grid;place-items:center}
.sw i::after{content:"";width:36%;aspect-ratio:1;border-radius:50%;background:#C8FF2E}
@keyframes pulse{50%{box-shadow:0 0 130px 24px rgba(200,255,46,.42)}}
h1{font:900 clamp(40px,9vw,88px)/1 Heebo;letter-spacing:-.04em;margin:0}
h1 b{color:#C8FF2E}
p{color:#8C8C98;margin:16px auto 0;max-width:34ch}
.mono{font:400 12px JetBrains Mono,monospace;letter-spacing:.14em;color:#C8FF2E;text-transform:uppercase;direction:ltr;display:block;margin-bottom:18px}
a{display:inline-block;margin-top:30px;color:#F3F3EE;text-decoration:none;border:1px solid #2C2C35;border-radius:999px;padding:14px 26px;font-weight:800}
a:hover{border-color:#F3F3EE}
@media (prefers-reduced-motion:reduce){.sw{animation:none}}
</style></head><body>
<main>
  <span class="mono">EDON X · in production</span>
  <div class="sw" aria-hidden="true"><i></i></div>
  <h1>EDON <b>X</b></h1>
  <p>הגרסה האימרסיבית של האתר נבנית ברגעים אלה. עוד מעט כאן.</p>
  <a href="../">לאתר הראשי ←</a>
</main>
</body></html>
