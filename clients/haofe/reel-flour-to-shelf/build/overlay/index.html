<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="local.css">
<style>
  :root {
    --brown: #34221b;
    --gold: #c49a66;
    --gold-deep: #a4815a;
    --cream: #fff6ea;
  }
  html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
  body { font-family: "Heebo", sans-serif; color: var(--cream); position: relative; }
  .layer { position: absolute; inset: 0; }
  .scrim-top {
    background: linear-gradient(to bottom, rgba(26, 15, 9, .48) 0%, rgba(26, 15, 9, .2) 26%, rgba(26, 15, 9, 0) 42%);
  }
  .scrim-hook {
    background: radial-gradient(ellipse 80% 34% at 50% 34%, rgba(26, 15, 9, .55), rgba(26, 15, 9, 0) 72%);
  }
  .shade { text-shadow: 0 4px 10px rgba(0,0,0,.45), 0 10px 40px rgba(0,0,0,.45); }

  /* hook */
  #hook { text-align: center; }
  #hook .pill {
    position: absolute; top: 300px; left: 50%; transform: translateX(-50%);
    font-weight: 600; font-size: 36px; letter-spacing: .5px; white-space: nowrap;
    padding: 12px 30px; border-radius: 999px;
    background: rgba(52, 34, 27, .72); border: 2px solid rgba(196, 154, 102, .85);
  }
  #hook .l1, #hook .l2 { position: absolute; left: 0; right: 0; font-family: "Suez One", serif; line-height: 1; }
  #hook .l1 { top: 420px; font-size: 128px; }
  #hook .l2 { top: 565px; font-size: 150px; color: var(--gold); white-space: nowrap; }

  /* rewind */
  #rewind { display: flex; align-items: center; justify-content: center; }
  #rewind svg { width: 260px; height: 260px; filter: drop-shadow(0 6px 24px rgba(0,0,0,.5)); }
  .scan {
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.07) 0 2px, rgba(0,0,0,0) 2px 6px);
    mix-blend-mode: screen;
  }

  /* chapters */
  #rail { position: absolute; top: 262px; left: 50%; width: 640px; height: 24px; transform: translateX(-50%); }
  #rail .line { position: absolute; top: 11px; left: 0; right: 0; height: 2px; background: rgba(255, 246, 234, .35); }
  #rail .fill { position: absolute; top: 10px; right: 0; height: 4px; background: var(--gold); border-radius: 2px; }
  #rail .dot {
    position: absolute; top: 4px; width: 16px; height: 16px; margin-right: -8px; border-radius: 50%;
    box-sizing: border-box; border: 2px solid rgba(255, 246, 234, .8); background: rgba(52, 34, 27, .6);
  }
  #rail .dot.done { background: var(--cream); border-color: var(--cream); }
  #rail .dot.now { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 0 6px rgba(196,154,102,.3); }
  .chapter { position: absolute; left: 0; right: 0; top: 318px; text-align: center; }
  .chapter .num { font-weight: 800; font-size: 40px; letter-spacing: 6px; color: var(--gold); direction: ltr; }
  .chapter .title { font-family: "Suez One", serif; font-size: 136px; line-height: 1.12; margin-top: 2px; }
  .chapter .sub { font-weight: 600; font-size: 50px; margin-top: 14px; }

  /* end card */
  #endshade { background: rgba(43, 26, 17, .74); }
  #end { text-align: center; }
  #end img { position: absolute; top: 300px; left: 50%; width: 380px; margin-left: -190px; }
  #end .h { position: absolute; left: 0; right: 0; font-family: "Suez One", serif; font-size: 96px; line-height: 1; }
  #end .h1 { top: 935px; }
  #end .h2 { top: 1045px; }
  #end .where { position: absolute; top: 1172px; left: 0; right: 0; font-weight: 600; font-size: 46px; color: var(--gold); }
  #end .chains {
    position: absolute; top: 1258px; left: 0; right: 0;
    display: flex; justify-content: center; align-items: center; gap: 16px;
  }
  #end .chain {
    font-weight: 800; font-size: 40px; line-height: 1; white-space: nowrap;
    padding: 14px 26px; border-radius: 999px; background: var(--cream); color: var(--brown);
    box-shadow: 0 6px 20px rgba(0,0,0,.3);
  }
  #end .more { font-weight: 700; font-size: 42px; white-space: nowrap; }
</style>
</head>
<body>
  <div class="layer scrim-top" id="scrimTop"></div>
  <div class="layer scrim-hook" id="scrimHook"></div>

  <div class="layer" id="hook">
    <div class="pill shade">מאחורי הקלעים · האופה</div>
    <div class="l1 shade">איך נולד</div>
    <div class="l2 shade">הבריוש שלנו?</div>
  </div>

  <div class="layer scan" id="scan"></div>
  <div class="layer" id="rewind">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="50,22 50,78 14,50" fill="#fff6ea"/>
      <polygon points="86,22 86,78 50,50" fill="#fff6ea"/>
    </svg>
  </div>

  <div id="rail"><div class="line"></div><div class="fill"></div></div>
  <div id="chapters"></div>

  <div class="layer" id="endshade"></div>
  <div class="layer" id="end">
    <img src="logo_dark.png" alt="">
    <div class="h h1 shade">חפשו אותנו</div>
    <div class="h h2 shade">בסופרים ליד הבית</div>
    <div class="where shade">בכל הארץ, מהצפון ועד הדרום</div>
    <div class="chains">
      <span class="chain">אושר עד</span>
      <span class="chain">ויקטורי</span>
      <span class="chain">מחסני השוק</span>
      <span class="more shade">ועוד</span>
    </div>
  </div>

<script>
// Timing from edit.py (seconds): hook, rewind, drop, end card.
const HOOK_OUT = 3.5, DROP = 4.0, END = 36.0;
const CHAPTERS = [
  { t0: 4.0,  t1: 7.0,  title: "לישה" },
  { t0: 7.0,  t1: 9.0,  title: "חלוקה" },
  { t0: 9.0,  t1: 15.0, title: "קליעה ביד" },
  { t0: 15.0, t1: 18.0, title: "שומשום" },
  { t0: 18.0, t1: 20.0, title: "התפחה" },
  { t0: 20.0, t1: 27.0, title: "אפייה", sub: "זהובה, ישר מהתנור", subAt: 21.0 },
  { t0: 27.0, t1: 33.0, title: "אריזה" },
  { t0: 33.0, t1: 36.0, title: "על המדף" },
];

const $ = (s, el = document) => el.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = x => Math.pow(clamp(x), 2);
const easeBack = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// 0 -> 1 over [a, a+d], held, then 1 -> 0 over [b-d2, b]
const env = (t, a, d, b, d2) => Math.min(easeOut((t - a) / d), 1 - easeIn((t - (b - d2)) / d2));

const rail = $("#rail");
CHAPTERS.forEach((c, i) => {
  const dot = document.createElement("div");
  dot.className = "dot";
  dot.style.right = (i / (CHAPTERS.length - 1) * 100) + "%";
  rail.appendChild(dot);
  const el = document.createElement("div");
  el.className = "chapter";
  el.innerHTML = `<div class="num shade">${String(i + 1).padStart(2, "0")}</div>` +
                 `<div class="title shade">${c.title}</div>` +
                 (c.sub ? `<div class="sub shade">${c.sub}</div>` : "");
  $("#chapters").appendChild(el);
  c.el = el;
});
const dots = [...rail.querySelectorAll(".dot")];

function seek(t) {
  // hook
  const hookOut = 1 - easeIn((t - (HOOK_OUT - 0.28)) / 0.26);
  $("#scrimHook").style.opacity = clamp(Math.min(easeOut(t / 0.2), hookOut));
  $("#hook .pill").style.opacity = Math.min(easeOut((t - 0.05) / 0.3), hookOut);
  const p1 = easeBack((t - 0.12) / 0.32), p2 = easeBack((t - 0.42) / 0.36);
  const l1 = $("#hook .l1"), l2 = $("#hook .l2");
  l1.style.opacity = Math.min(clamp((t - 0.12) / 0.18), hookOut);
  l1.style.transform = `translateY(${(1 - p1) * 40 - (1 - hookOut) * 30}px) scale(${0.86 + 0.14 * p1})`;
  l2.style.opacity = Math.min(clamp((t - 0.42) / 0.18), hookOut);
  l2.style.transform = `translateY(${(1 - p2) * 50 - (1 - hookOut) * 30}px) scale(${0.8 + 0.2 * p2})`;

  // rewind between the hook and the drop
  const rw = t >= HOOK_OUT && t < DROP;
  $("#scan").style.opacity = rw ? 1 : 0;
  const rwk = rw ? Math.min(easeOut((t - HOOK_OUT) / 0.08), 1 - easeIn((t - (DROP - 0.12)) / 0.12)) : 0;
  $("#rewind").style.opacity = rwk;
  $("#rewind svg").style.transform = `scale(${0.9 + 0.1 * Math.abs(Math.sin((t - HOOK_OUT) * 18))})`;

  // chapters + progress rail
  const railOn = env(t, DROP, 0.3, END - 0.05, 0.35);
  rail.style.opacity = railOn;
  $("#scrimTop").style.opacity = clamp(Math.max(railOn, (t < HOOK_OUT) ? 0.6 : 0));
  let idx = -1;
  CHAPTERS.forEach((c, i) => {
    if (t >= c.t0 && t < c.t1) idx = i;
    const last = i === CHAPTERS.length - 1;
    const outD = last ? 0.35 : 0.18;
    const o = (t < c.t0 - 0.01 || t > c.t1) ? 0 : env(t, c.t0 + 0.04, 0.22, c.t1 - (last ? 0.05 : 0.02), outD);
    c.el.style.opacity = o;
    const k = easeOut((t - c.t0 - 0.04) / 0.32);
    const num = c.el.querySelector(".num"), title = c.el.querySelector(".title");
    num.style.transform = `translateY(${(1 - k) * 18}px)`;
    // reveal right-to-left, the way Hebrew reads
    const r = easeOut((t - c.t0 - 0.08) / 0.38);
    title.style.clipPath = `inset(0 0 0 ${(1 - r) * 100}%)`;
    title.style.transform = `translateX(${-(1 - r) * 24}px)`;
    const sub = c.el.querySelector(".sub");
    if (sub) {
      const s = easeOut((t - c.subAt) / 0.35);
      sub.style.opacity = s;
      sub.style.transform = `translateY(${(1 - s) * 20}px)`;
    }
  });
  dots.forEach((d, i) => {
    d.className = "dot" + (i < idx ? " done" : i === idx ? " now" : "");
  });
  // the gold line runs from step 1 to the current step, easing between them
  let prog = 0;
  if (idx >= 0) {
    const c = CHAPTERS[idx];
    prog = (idx - 1 + easeOut((t - c.t0) / 0.4)) / (CHAPTERS.length - 1);
    prog = Math.max(prog, 0);
  }
  $("#rail .fill").style.width = (prog * 100) + "%";

  // end card
  $("#endshade").style.opacity = easeOut((t - END) / 0.5);
  const e = $("#end");
  const rise = (el, at, dist = 20, dur = 0.45) => {
    const k = easeOut((t - at) / dur);
    el.style.opacity = k;
    el.style.transform = `translateY(${(1 - k) * dist}px)`;
  };
  const lg = easeOut((t - (END + 0.15)) / 0.6);
  e.querySelector("img").style.opacity = lg;
  e.querySelector("img").style.transform = `scale(${0.9 + 0.1 * lg})`;
  rise(e.querySelector(".h1"), END + 0.7);
  rise(e.querySelector(".h2"), END + 0.95);
  rise(e.querySelector(".where"), END + 1.4);
  e.querySelectorAll(".chains > *").forEach((el, i) => {
    const k = easeBack((t - (END + 1.85 + i * 0.22)) / 0.4);
    el.style.opacity = clamp((t - (END + 1.85 + i * 0.22)) / 0.15);
    el.style.transform = `scale(${0.7 + 0.3 * k})`;
  });
}
window.seek = seek;
seek(0);
</script>
</body>
</html>
