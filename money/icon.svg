<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11201E"/>
      <stop offset="1" stop-color="#06090B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#2DD4A4" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#0F766E" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0F766E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mk" x1="0.15" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="0.6" stop-color="#34D3A6"/>
      <stop offset="1" stop-color="#7DF2D0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="6"/>
  <!-- open ring = the month's cycle, closing upward -->
  <path d="M376 186 A140 140 0 1 0 396 256" fill="none" stroke="url(#mk)" stroke-width="44" stroke-linecap="round"/>
  <circle cx="396" cy="256" r="0" fill="#7DF2D0"/>
  <!-- balance: two equal bars -->
  <path d="M196 226 H316 M196 290 H316" fill="none" stroke="#E9FFF8" stroke-width="40" stroke-linecap="round"/>
</svg>
